name: CI

# Pull requests only get the default read-only token, and nothing here needs
# more. No secret is referenced, and `pull_request` (never
# `pull_request_target`) means a fork's code cannot reach one.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Read from .nvmrc rather than pinned here, so CI and a contributor
      # running `nvm use` cannot drift apart.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Builds, typechecks, runs the negotiation unit tests and the output
      # assertions, then asserts across every built file that each page has a
      # twin, each twin has the right canonical, no twin reached the sitemap
      # and llms.txt links all of them.
      #
      # That last step is the one that earns its place: the site can look
      # perfect in a browser while the half built for machines is silently
      # missing, and no human review catches it.
      - run: npm test
