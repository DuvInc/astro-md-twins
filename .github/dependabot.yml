# Dependencies are pinned exactly in package.json, which is what makes a clone
# build the same way tomorrow as it does today. The cost of pinning is that
# nothing moves on its own, including a security patch, so something has to
# open those bumps and this is it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Astro and TypeScript majors change behaviour this repository builds on.
    # They are worth doing deliberately, with the release notes open, rather
    # than as a pull request that happens to be green.
    ignore:
      - dependency-name: astro
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: wrangler
        update-types: [version-update:semver-major]
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
